<div class="content">
  <div class="page-header">
    <div class="page-title">Inteligência<span>Análise Preditiva de Falhas</span></div>
    <button class="btn btn-primary" id="btn-gerar-pdf">Gerar relatório PDF →</button>
  </div>
  <div class="grid3" style="margin-bottom:22px;">
    <div class="kpi red"><div class="kpi-label">Risco Geral da Missão</div><div class="kpi-value" id="risco-nivel">—</div><div class="kpi-sub" id="risco-score"></div></div>
    <div class="kpi yellow"><div class="kpi-label">Falhas Previstas (7d)</div><div class="kpi-value" id="total-falhas">—</div><div class="kpi-sub" id="falhas-sub"></div></div>
    <div class="kpi purple"><div class="kpi-label">Modelo ML</div><div class="kpi-value">96.2%</div><div class="kpi-sub">precisão do modelo atual</div></div>
  </div>
  <div class="grid2">
    <div class="card">
      <div class="card-title">Previsão de Falhas — Próximos 7 Dias</div>
      <div id="previsoes-container"><div class="loading">Carregando análise...</div></div>
    </div>
    <div class="card">
      <div class="card-title">Tendência — Pressão Propulsão</div>
      <svg viewBox="0 0 360 180" style="width:100%;height:180px;">
        <line x1="0" y1="45" x2="360" y2="45" stroke="var(--border)" stroke-width="1"/>
        <line x1="0" y1="90" x2="360" y2="90" stroke="var(--border)" stroke-width="1"/>
        <line x1="0" y1="135" x2="360" y2="135" stroke="var(--border)" stroke-width="1"/>
        <line x1="0" y1="60" x2="360" y2="60" stroke="rgba(217,119,6,0.4)" stroke-width="1.5" stroke-dasharray="6,3"/>
        <text x="4" y="57" fill="rgba(217,119,6,0.8)" font-size="9" font-family="DM Mono">LIMIAR 15 PSI</text>
        <polyline points="0,70 40,75 80,80 120,85 160,88 200,92 240,100 280,110" fill="none" stroke="var(--accent)" stroke-width="2.5"/>
        <polyline points="280,110 320,125 360,145" fill="none" stroke="var(--critical)" stroke-width="2.5" stroke-dasharray="6,3"/>
        <polygon points="280,105 320,115 360,130 360,160 320,140 280,115" fill="rgba(220,38,38,0.07)" stroke="none"/>
        <text x="4" y="14" fill="var(--accent)" font-size="9" font-family="DM Mono">← histórico</text>
        <text x="285" y="14" fill="var(--critical)" font-size="9" font-family="DM Mono">previsão →</text>
        <line x1="280" y1="0" x2="280" y2="180" stroke="var(--border2)" stroke-width="1" stroke-dasharray="3,3"/>
      </svg>
      <div style="font-size:0.72rem;color:var(--muted2);margin-top:10px;">
        Tendência de queda linear detectada. Intervenção recomendada em até 48h.
      </div>
    </div>
  </div>
</div>
<script type="module">
import { get, post, toast, getUsuario } from '/js/api.js';

const BADGE = { Crítico:'badge-critical', Alto:'badge-high', Médio:'badge-medium' };
const COR_BORDER = { Crítico:'rgba(220,38,38,0.25)', Alto:'rgba(234,124,0,0.25)', Médio:'rgba(217,119,6,0.25)' };
const COR_BG     = { Crítico:'rgba(220,38,38,0.03)', Alto:'rgba(234,124,0,0.03)', Médio:'rgba(217,119,6,0.03)' };
const COR_BAR    = { Crítico:'var(--critical)', Alto:'var(--high)', Médio:'var(--medium)' };

async function carregar() {
  const dados = await get('/api/preditiva');

  document.getElementById('risco-nivel').textContent = dados.risco_nivel;
  document.getElementById('risco-score').textContent = `score: ${dados.risco_score} / 1.0`;
  document.getElementById('total-falhas').textContent = dados.total_falhas;
  document.getElementById('falhas-sub').textContent =
    dados.previsoes.length > 0 ? `próx.: ${dados.previsoes[0].sensor} em ${dados.previsoes[0].data}` : 'Sem falhas previstas';

  const pc = document.getElementById('previsoes-container');
  if (dados.previsoes.length === 0) {
    pc.innerHTML = '<div class="empty">Nenhuma falha prevista nos próximos 7 dias ✓</div>';
    return;
  }
  pc.innerHTML = dados.previsoes.map(p => `
    <div style="padding:14px;border:1px solid ${COR_BORDER[p.status]};border-radius:var(--radius-sm);
      background:${COR_BG[p.status]};margin-bottom:12px;">
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:7px;">
        <span style="font-size:0.85rem;font-weight:500;">${p.sensor}</span>
        <span class="badge ${BADGE[p.status]}">${p.prob_pct} prob.</span>
      </div>
      <div style="font-size:0.7rem;color:var(--muted2);">Previsão: ${p.data} · Sensor: ${p.sensor_id}</div>
      <div style="margin-top:10px;height:6px;background:var(--bg);border-radius:4px;">
        <div style="width:${p.prob_pct};height:100%;background:${COR_BAR[p.status]};border-radius:4px;"></div>
      </div>
    </div>`).join('');
}

document.getElementById('btn-gerar-pdf').addEventListener('click', async () => {
  const btn = document.getElementById('btn-gerar-pdf');
  btn.textContent = 'Gerando PDF...'; btn.disabled = true;
  const res = await post('/api/relatorios/gerar', {
    tipo: 'Análise Preditiva Completa', periodo: '7 dias', formato: 'PDF', _autor: getUsuario()
  });
  btn.textContent = 'Gerar relatório PDF →'; btn.disabled = false;
  if (res.ok) {
    toast('PDF gerado! Baixando...', 'ok');
    window.location.href = res.url;
  } else {
    toast(res.erro || 'Erro ao gerar PDF', 'erro');
  }
});

carregar();
</script>
